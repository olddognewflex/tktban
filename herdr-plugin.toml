# herdr-plugin.toml: runs tktban as a herdr plugin.
#
# The board opens as a full-size popup over the current workspace and reads the
# tkt config found from that workspace (focused pane dir, then workspace root).
# Bind the action to a key in ~/.config/herdr/config.toml:
#
#   [[keys.command]]
#   key = "prefix+t"   # prefix+b is taken by herdr's sidebar toggle
#   type = "plugin_action"
#   command = "odnf.tktban.open-board"
#
# Live agent badges need no hook: the open board polls herdr's socket
# (HERDR_SOCKET_PATH) itself; --no-herdr-live turns that off. The same socket
# carries the card -> pane jump (pane.focus).
#
# The [[events]] hook below toasts through herdr (notification.show) when an
# agent on a ticket branch goes blocked ("TKB-24 needs you", sound request) or
# done ("TKB-24 finished", sound done), unless its pane is focused. It works
# with the board closed. herdr's own background-agent toasts still fire too,
# so expect both. Ours are silenced by `notify = false` in the plugin
# settings.toml, which the board's `b` key writes (inside herdr, where the
# board keeps its settings in that same state dir).
# Write-back hooks come later; see docs/herdr-events.md for which events a
# manifest can hook.
#
# Each poll also reconciles the ticket key of every agent pane with herdr's
# own `ticket` pane-metadata token (source "odnf.tktban"), reporting only the
# panes whose key herdr does not already hold. herdr's sidebar rows can show
# it as $ticket -- nothing here configures that, it is a herdr setting:
#
#   [ui.sidebar.agents]
#   rows = [["state_icon", "machine", "workspace", "tab"], ["$ticket"], ["agent"]]
#
# Only tokens are reported: pane titles stay with whatever plugin owns them.
# --no-herdr-tokens turns the reporting off, and so does --no-herdr-live,
# which takes the poll it rides on away.
id = "odnf.tktban"
name = "tktban"
version = "0.1.0"
description = "Kanban board for tkt tickets, opened over any herdr workspace."
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]

# Built at install time; needs Go on herdr's PATH.
[[build]]
command = ["go", "build", "-o", "bin/tktban", "./cmd/tktban"]

# The board TUI. --herdr picks the config from the herdr context and keeps UI
# settings in the plugin state dir. --select-from-cwd opens the board on the
# ticket named by the branch checked out where the board key was pressed: the
# launcher passes that directory as --cwd and forwards its herdr context in
# the environment, because plugin.pane.open carries cwd and env but no argv.
# --popup says this board is the popup, so that `o` (or `ga`) — which focuses
# the herdr pane running the selected card's agent — exits afterwards, which
# is what closes the popup. Do not add --popup to a board you run by hand.
#
# A popup, not an overlay: herdr 0.9.0 sizes an overlay's (and a tab's)
# terminal to the pane it covers and never resizes it, so in a split workspace
# the board rendered at the covered pane's size inside a full-screen overlay.
# A popup gets a terminal of its declared size.
[[panes]]
id = "board"
title = "tktban"
placement = "popup"
width = "100%"
height = "100%"
command = ["./bin/tktban", "--herdr", "--popup", "--select-from-cwd"]

# Toggle the board: open it, or close the open popup on a second press.
[[actions]]
id = "open-board"
title = "tktban: open board"
description = "Toggle the tktban board popup."
contexts = ["pane", "workspace"]
command = ["bash", "scripts/open-board.sh"]

# One run per status change in any pane. working/idle exit at once; blocked
# and done re-read the pane, find its ticket and toast (see README,
# "Notifications"). Runs from the plugin root, so ./bin/tktban resolves; it
# always exits 0 and prints its decision to `herdr plugin log list`.
[[events]]
on = "pane.agent_status_changed"
command = ["./bin/tktban", "herdr-hook"]
